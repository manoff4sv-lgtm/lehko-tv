plugins {
    id "com.android.application"
}

// The version comes from the git tag in CI (v1.2.3 -> versionName 1.2.3, versionCode 10203).
def tag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
def appVersion = (tag != null && tag ==~ /v\d+\.\d+\.\d+/) ? tag.substring(1) : "1.0.0"
def appVersionCode = appVersion.tokenize(".").collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

// Release signing comes from environment variables (set by CI from repository secrets).
// Without them the release build is signed with the debug key, so forks and local builds still work.
def releaseKeystore = System.getenv("LEHKO_KEYSTORE")

android {
    namespace "ua.lehko.tv"
    compileSdk 34

    defaultConfig {
        applicationId "ua.lehko.tv"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("LEHKO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LEHKO_KEY_ALIAS")
                keyPassword System.getenv("LEHKO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Tests only: the app itself has no dependencies.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
