plugins {
    id "com.android.application"
}

// The version comes from the git tag in CI (v1.2.3 -> versionName 1.2.3, versionCode 10203; v0.9.0-beta.1 -> 0.9.0-beta.1;
// v1.2 counts as v1.2.0). Any other tag fails the build: versionCode 1 would be a downgrade no TV installs.
def tag = System.getenv("GITHUB_REF_TYPE") == "tag" ? System.getenv("GITHUB_REF_NAME") : null
def tagMatch = tag != null ? (tag =~ /^v(\d+)\.(\d+)(?:\.(\d+))?(-[0-9A-Za-z.]+)?$/) : null
if (tag != null && !tagMatch.matches()) {
    throw new GradleException("Release tags must look like v1.2.3 or v1.2.3-beta.1, got " + tag)
}
def appVersion = tag != null ? tag.substring(1) : "0.0.0-dev"
def appVersionCode = tag != null
        ? (tagMatch.group(1) as int) * 10000 + (tagMatch.group(2) as int) * 100 + ((tagMatch.group(3) ?: "0") as int)
        : 1

// Release signing comes from environment variables (set by CI from repository secrets).
// Without them the release build is signed with the debug key, so forks and local builds still work.
def releaseKeystore = System.getenv("LEHKO_KEYSTORE")

android {
    namespace "ua.lehko.tv"
    compileSdk 34

    defaultConfig {
        applicationId "ua.lehko.tv"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("LEHKO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LEHKO_KEY_ALIAS")
                keyPassword System.getenv("LEHKO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Tests only: the app itself has no dependencies.
    testImplementation "junit:junit:4.13.2"
    // Android's own org.json (the same code as on the TV), not json.org's.
    testImplementation "com.vaadin.external.google:android-json:0.0.20131108.vaadin1"
}
