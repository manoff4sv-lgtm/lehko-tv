# Builds and tests Lehko on every push and pull request. A tag like v1.2.3 also publishes a GitHub Release with
# Lehko.apk, so the latest APK is always at .../releases/latest/download/Lehko.apk
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.LEHKO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Release signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LEHKO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "LEHKO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          LEHKO_KEYSTORE_PASSWORD: ${{ secrets.LEHKO_KEYSTORE_PASSWORD }}
          LEHKO_KEY_ALIAS: ${{ secrets.LEHKO_KEY_ALIAS }}
          LEHKO_KEY_PASSWORD: ${{ secrets.LEHKO_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Lehko.apk
          ls -l Lehko.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Lehko-apk
          path: Lehko.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "Refusing to publish a debug-signed release: add the signing secrets."; exit 1; fi
          gh release create "$GITHUB_REF_NAME" Lehko.apk --title "Lehko ${GITHUB_REF_NAME#v}" --generate-notes
